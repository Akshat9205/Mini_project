<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SkillUp Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Login Page Styles - matches provided mockup */
        .login-page {
            min-height: 100vh;
            background: radial-gradient(800px 400px at 10% 10%, rgba(255,255,255,0.8), rgba(255,255,255,0)),
                        linear-gradient(180deg, #eaf8ee 0%, #dff3e8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-shell {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 2rem;
            position: relative;
        }

        .brand-panel {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 2rem;
            color: #EAE6FF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.35);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .brand-logo-badge {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #7D5CFF, #4AC2FF);
        }

        .brand-title {
            font-weight: 900;
            color: #000;
            letter-spacing: 0.3px;
        }

        .brand-headline {
            font-size: 1.4rem;
            font-weight: 600;
            color: #191532;
            margin: 0.75rem 0 0.5rem;
        }

        .brand-subtext {
            color: #7160dc;
            line-height: 1.8;
        }

        .brand-cta {
            margin-top: 1.5rem;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .brand-chip {
            border: 1px solid rgba(255,255,255,0.18);
            color: #EAE6FF;
            background: transparent;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 500;
            cursor: default;
        }

        .auth-card {
            background: #ffffff;
            border: 1px solid #e6f3ea;
            border-radius: 22px;
            padding: 2.2rem;
            color: #111;
            box-shadow: 0 24px 60px rgba(16,24,40,0.15);
            animation: fadeUp .5s ease forwards;
        }

        .auth-card h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.9rem;
            font-weight: 800;
            color: #0f172a;
        }

        .auth-muted { color: #667085; font-size: 1rem; margin-bottom: 1.25rem; }

        .login-tabs { display: none; }

        .input-with-icon { position: relative; width: 100%; display: block; }
        .input-with-icon svg { position: absolute; left: 14px; top: 70%; transform: translateY(-50%); color: #98a2b3; }
        .input-with-icon .toggle-password { position: absolute; right: 36px; top: 70%; transform: translateY(-50%); background: none; border: 0; color: #98a2b3; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; z-index: 9; }
        .input-with-icon input {
            width: 100%;
            max-width: 100%;
            display: block;
            box-sizing: border-box;
            padding-left: 42px;
            padding-right: 56px;
            background: #fff;
            border-radius: 12px;
            border: 1px solid #E4E7EC;
            height: 46px;
        }
        .input-with-icon input::placeholder { color: #98A2B3; }
        .input-with-icon input:focus { outline: none; border-color:#16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,0.12); }

        .form-group { margin-bottom: 18px; }
        .form-group label { color: #DCD6FF; font-weight: 700; }

        .form-options a { color: #9AD0FF; }
        .form-options a:hover { text-decoration: underline; }

        .btn-primary { width: 100%; padding: 14px 22px; border-radius: 10px; border: none; outline: none; font-weight: 700; font-size: 1rem; background:#111; color:#fff; box-shadow: 0 6px 18px rgba(16,24,40,0.12); }
        .btn-primary:hover { filter: brightness(.96); }
        .modal-buttons { margin-top: 18px; display: block; }

        .alternate-auth { text-align: center; margin-top: 14px; color: #CFC8FF; font-size: 0.95rem; }
        .alternate-auth button { background: none; border: none; color: #9AD0FF; font-weight: 600; cursor: pointer; }

        /* Social buttons tuned to mockup */
        .social-login { margin-top: 14px; }
        .social-login p { color: #CFC8FF; }
        .social-login p::before, .social-login p::after { background: rgba(255,255,255,0.25); }
        .social-buttons { gap: 14px; }
        .social-btn { border-radius: 14px; padding: 14px 18px; background: #ffffff; }
        .social-btn.google { border-color: #FF8A80; color: #1d6adc; box-shadow: 0 0 0 2px rgba(219,68,55,0.12) inset; }
        .social-btn.google:hover { background: #fff; box-shadow: 0 0 0 2px rgba(219,68,55,0.2) inset; }
        .social-btn.facebook { border-color: #64B5F6; color: #1877F2; box-shadow: 0 0 0 2px rgba(24,119,242,0.12) inset; }
        .social-btn.facebook:hover { background: #fff; box-shadow: 0 0 0 2px rgba(24,119,242,0.2) inset; }

        /* Checkbox accent color */
        .remember-me input[type="checkbox"],
        #terms-agree {
            accent-color: #6a11cb;
        }

        .back-home {
            position: absolute;
            top: -10px;
            left: -10px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .back-home:hover { background: rgba(0,0,0,0.08); transform: scale(1.05); }

        /* Simple animations */
        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(10px);} 100% { opacity: 1; transform: translateY(0);} }
        @keyframes floatY { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-6px);} }
        .hero-img { width: 100%; max-width: 420px; margin: 1rem auto; filter: drop-shadow(0 14px 40px rgba(16,24,40,0.12)); animation: floatY 6s ease-in-out infinite; border-radius: 12px; }
        .dots { display:flex; gap:8px; justify-content:center; margin-top: 14px; }
        .dot { width:8px; height:8px; background:#a7f3d0; border-radius: 9999px; opacity: .6; }
        .dot.active { background:#16a34a; opacity: 1; }

        /* Responsive */
        @media (max-width: 900px) {
            .login-shell { grid-template-columns: 1fr; max-width: 560px; }
            .brand-panel { order: 2; }
        }
        @media (max-width: 480px) {
            .login-page { padding: 1rem; }
            .auth-card { padding: 1.25rem; }
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div class="login-page">
        <div class="login-shell">
            <div class="brand-panel">
                <div class="brand-logo">
                    <div class="brand-logo-badge"></div>
                    <div class="brand-title">SkillUp Tracker</div>
                </div>
                <div class="brand-headline">SkillUp</div>
                <div class="brand-subtext">Unleash your learning potential with daily streaks, goals and progress tracking.</div>
                <img class="hero-img" src="https://images.unsplash.com/photo-1523580846011-d3a5bc25702b?q=80&w=1200&auto=format&fit=crop" alt="Learning illustration">
                <div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
                <div class="brand-cta">
                    <span class="brand-chip">Why SkillUp?</span>
                    <span class="brand-chip">Gamification</span>
                </div>
            </div>

            <div class="auth-card">
                <a href="index.html" class="back-home" title="Back to Home">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>

                <h2>Log In to SkillUp Tracker</h2>
                <div class="auth-muted">Welcome back! Please enter your details.</div>

                <div class="login-tabs">
                    <button class="login-tab active" onclick="showLogin()">Login</button>
                    <button class="login-tab" onclick="showSignup()">Sign Up</button>
                </div>

                <!-- Login Form -->
                <div id="login-form-container">
                    <div id="login-message"></div>

                    <form id="login-form">
                        <div class="form-group input-with-icon">
                            <label for="login-email" style="color:#191532;">Your Email</label>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 0l8 7 8-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            <input type="email" id="login-email" name="login-email" placeholder="mail@gmail.com" required>
                        </div>
                        <div class="form-group input-with-icon">
                            <label for="login-password" style="color:#191532;">Password</label>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="18" height="10" rx="2" ry="2" stroke="currentColor" stroke-width="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                            <input type="password" id="login-password" name="login-password" placeholder="••••••••" required>
                            <button type="button" class="toggle-password" aria-label="Show password" data-target="login-password">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
                            </button>
                        </div>

                        <div class="form-options">
                            <label class="remember-me">
                                <input type="checkbox" id="remember-me" name="remember-me"> Remember me
                            </label>
                            <a href="#">Forgot password?</a>
                        </div>

                        <div class="form-group" id="login-captcha-group">
                            <label style="color:#191532;">Captcha: <span id="login-captcha-question"></span></label>
                            <input type="text" id="login-captcha" name="login-captcha" placeholder="Answer" required>
                        </div>

                        <div class="modal-buttons">
                            <button type="submit" class="btn btn-primary">Log in</button>
                        </div>
                    </form>

                    <div class="alternate-auth" style="color:#191532;">Don't have an account? <a href="signup.html" style="color:#9AD0FF; font-weight:600; text-decoration:none;">Sign up</a></div>
                </div>

                <!-- OTP Verification Form -->
                <div id="otp-form-container" style="display: none;">
                    <div id="otp-message"></div>
                    <form id="otp-form">
                        <div class="form-group input-with-icon">
                            <label for="otp-code">Enter OTP sent to your email</label>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 0l8 7 8-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            <input type="text" id="otp-code" name="otp-code" placeholder="6-digit code" maxlength="6" required>
                        </div>
                        <div class="modal-buttons">
                            <button type="submit" class="btn btn-primary">Verify OTP</button>
                        </div>
                    </form>
                    <div class="alternate-auth">
                        Didn't get the code? <button type="button" id="resend-otp-btn">Resend OTP</button>
                    </div>
                    <div class="alternate-auth" style="margin-top:8px;">
                        <button type="button" id="back-to-login-btn">Back to login</button>
                    </div>
                </div>

                <!-- Signup Form -->
                <div id="signup-form-container" style="display: none;">
                    <div id="signup-message"></div>

                    <form id="signup-form">
                        <div class="form-group input-with-icon">
                            <label for="signup-name">Full Name</label>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M4 20a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                            <input type="text" id="signup-name" name="signup-name" placeholder="Enter your full name" required>
                        </div>
                        <div class="form-group input-with-icon">
                            <label for="signup-email">Email Address</label>
                            <svg width="18" height="10" viewBox="0 0 24 24" fill="none"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 0l8 7 8-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            <input type="email" id="signup-email" name="signup-email" placeholder="Enter your email" required>
                        </div>
                        <div class="form-group input-with-icon">
                            <label for="signup-password">Password</label>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="18" height="10" rx="2" ry="2" stroke="currentColor" stroke-width="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                            <input type="password" id="signup-password" name="signup-password" placeholder="Create a strong password" required>
                            <button type="button" class="toggle-password" aria-label="Show password" data-target="signup-password">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
                            </button>
                        </div>
                        <div class="form-group input-with-icon">
                            <label for="signup-confirm-password">Confirm Password</label>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="18" height="10" rx="2" ry="2" stroke="currentColor" stroke-width="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                            <input type="password" id="signup-confirm-password" name="signup-confirm-password" placeholder="Confirm your password" required>
                            <button type="button" class="toggle-password" aria-label="Show password" data-target="signup-confirm-password">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
                            </button>
                        </div>

                        <div class="form-group" id="signup-captcha-group">
                            <label>Captcha: <span id="signup-captcha-question"></span></label>
                            <input type="text" id="signup-captcha" name="signup-captcha" placeholder="Answer" required>
                        </div>

                        <div class="form-options">
                            <label class="remember-me">
                                <input type="checkbox" id="terms-agree" name="terms-agree" required>
                                I agree to the <a href="#">Terms & Conditions</a>
                            </label>
                        </div>

                        <div class="modal-buttons">
                            <button type="submit" class="btn btn-primary">Create Account</button>
                        </div>
                    </form>

                    <div class="alternate-auth">Already have an account? <button type="button" onclick="showLogin()">Log in</button></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="login.js"></script>
</body>
</html>
